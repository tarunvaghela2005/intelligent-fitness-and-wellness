server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthenticationFilter

        - id: health-service
          uri: lb://health-service
          predicates:
            - Path=/api/v1/health/**

        - id: workout-service
          uri: lb://workout-service
          predicates:
            - Path=/api/v1/workouts/**
          filters:
            - AuthenticationFilter

        - id: nutrition-service
          uri: lb://nutrition-service
          predicates:
            - Path=/api/v1/nutrition/**
          filters:
            - AuthenticationFilter

        - id: progress-service
          uri: lb://progress-service
          predicates:
            - Path=/api/v1/progress/**
          filters:
            - AuthenticationFilter

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

