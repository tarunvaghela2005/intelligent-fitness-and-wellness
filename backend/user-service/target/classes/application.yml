server:
  port: 8081

spring:
  application:
    name: user-service

  # ==============================
  # PostgreSQL Database
  # ==============================
  datasource:
    url: jdbc:postgresql://localhost:5432/fitwell_user_db
    driver-class-name: org.postgresql.Driver
    username: fitwell_admin
    password: FitWell@123

  # ==============================
  # JPA / Hibernate
  # ==============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ==============================
  # Flyway
  # ==============================
  flyway:
    enabled: false
    baseline-on-migrate: true

# ==============================
# Eureka
# ==============================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ==============================
# JWT
# ==============================
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000